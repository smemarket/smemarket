# Builds the static site and publishes it to GitHub Pages on every push to main.
# Settings → Pages → Source must be "GitHub Actions".
# Optional: Settings → Secrets and variables → Actions → Variables → LEAD_ENDPOINT
#   = a URL that accepts a JSON POST (Formspree, Web3Forms, Make, Zapier…). Without it, forms open WhatsApp instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci --legacy-peer-deps

      - run: npm run build:pages
        env:
          # "/smemarket" on smemarket.github.io/smemarket, empty once a custom domain is set
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}
          NEXT_TELEMETRY_DISABLED: 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
